<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;width:1280px;height:854px;overflow:hidden;font-family:var(--font-heading);}
  .wrap{display:flex;width:1280px;height:854px;}
  .main{flex:1;background:var(--plum-500);display:flex;align-items:center;justify-content:center;}
  .name{color:var(--bone-50);font-size:140px;font-weight:500;line-height:1;letter-spacing:-0.03em;}
  .strip{display:flex;flex-direction:column;width:150px;}
  .strip>div{flex:1;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="main"><div class="name">Antaeus</div></div>
    <div class="strip">
      <div style="background:#A68DBD;"></div>
      <div style="background:#6B8E6F;"></div>
      <div style="background:#C48A3A;"></div>
      <div style="background:#B35B4A;"></div>
    </div>
  </div>
</body>
</html>
