<!doctype html>
<!-- @dsCard group="Components" name="Inputs" subtitle="Text, focused, search" viewport="700x320" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
label { display:block; margin-bottom:16px; } input { display:block; width:100%; padding:12px; margin-top:8px; font-size:15px; } .focused { box-shadow:var(--ring-focus); border-color:var(--border-brand); }
</style></head><body>
<label>Reading label<input class="field-control" placeholder="e.g. Fasting glucose"></label>
<label>Notes for Dr. Patel<input class="field-control focused" value="Took reading 10 min after waking."></label>
<label>Search records<input type="search" class="field-control" placeholder="Search records, providers, medications…"></label>
</body></html>
