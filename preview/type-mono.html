<!doctype html>
<!-- @dsCard group="Type" name="Type — Mono / Metrics" subtitle="IBM Plex Mono, tabular-nums" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card col" style="gap: 14px;">
    <div class="label-eyebrow">Mono — IBM Plex Mono, tabular numerals</div>
    <div class="row" style="gap: 32px; align-items: baseline;">
      <div>
        <div style="font-family: var(--font-mono); font-size: 56px; font-weight: 500; letter-spacing: -0.02em; color: var(--fg-1); line-height: 1; font-variant-numeric: tabular-nums;">128</div>
        <div style="font-family: var(--font-body); font-size: 11px; color: var(--fg-3); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;">mg/dL · fasting</div>
      </div>
      <div>
        <div style="font-family: var(--font-mono); font-size: 56px; font-weight: 500; letter-spacing: -0.02em; color: var(--fg-1); line-height: 1; font-variant-numeric: tabular-nums;">72</div>
        <div style="font-family: var(--font-body); font-size: 11px; color: var(--fg-3); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;">bpm · resting</div>
      </div>
      <div>
        <div style="font-family: var(--font-mono); font-size: 56px; font-weight: 500; letter-spacing: -0.02em; color: var(--fg-1); line-height: 1; font-variant-numeric: tabular-nums;">6<span style="font-size: 32px; color: var(--fg-3);">h</span>42<span style="font-size: 32px; color: var(--fg-3);">m</span></div>
        <div style="font-family: var(--font-body); font-size: 11px; color: var(--fg-3); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;">sleep · last night</div>
      </div>
    </div>
    <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3);">Always tabular-nums. Unit label is sans eyebrow, not inline.</div>
  </div>
</body></html>
