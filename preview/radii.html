<!doctype html>
<!-- @dsCard group="Spacing" name="Radii" subtitle="4 / 6 / 10 / 16 / 24 / pill" viewport="700x160" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card col" style="gap: 10px;">
    <div class="label-eyebrow">Radii — restrained</div>
    <div class="row" style="gap: 14px;">
      <div style="text-align: center;"><div style="width: 56px; height: 56px; background: #fff; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--border-subtle);"></div><div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 6px;">xs · 4</div></div>
      <div style="text-align: center;"><div style="width: 56px; height: 56px; background: #fff; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--border-subtle);"></div><div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 6px;">sm · 6</div></div>
      <div style="text-align: center;"><div style="width: 56px; height: 56px; background: #fff; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--border-subtle);"></div><div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 6px;">md · 10</div></div>
      <div style="text-align: center;"><div style="width: 56px; height: 56px; background: #fff; border-radius: 16px; box-shadow: inset 0 0 0 1px var(--border-subtle);"></div><div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 6px;">lg · 16</div></div>
      <div style="text-align: center;"><div style="width: 56px; height: 56px; background: #fff; border-radius: 24px; box-shadow: inset 0 0 0 1px var(--border-subtle);"></div><div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 6px;">xl · 24</div></div>
      <div style="text-align: center;"><div style="width: 56px; height: 56px; background: #fff; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--border-subtle);"></div><div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 6px;">pill</div></div>
    </div>
    <div style="font-family: var(--font-body); font-size: 12px; color: var(--fg-3);">Cards use 16. Buttons use 10. Pill only for tags & avatars.</div>
  </div>
</body></html>
