<!doctype html>
<!-- @dsCard group="Components" name="Badges & status" subtitle="Semantic pills + tag chips" viewport="700x160" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card col" style="gap: 12px;">
    <div style="font-family: var(--font-heading); font-size: 17px; color: var(--fg-2); letter-spacing: -0.01em;">Badges &amp; status pills</div>
    <div class="wrap" style="gap: 8px;">
      <div style="display: inline-flex; align-items: center; gap: 6px; background: #E4ECE3; padding: 5px 10px; border-radius: 999px; font-family: var(--font-body); font-size: 11px; font-weight: 600; color: #3a5a3f;"><div style="width: 6px; height: 6px; border-radius: 3px; background: #6B8E6F;"></div>Within range</div>
      <div style="display: inline-flex; align-items: center; gap: 6px; background: #F5E8D0; padding: 5px 10px; border-radius: 999px; font-family: var(--font-body); font-size: 11px; font-weight: 600; color: #7a541e;"><div style="width: 6px; height: 6px; border-radius: 3px; background: #C48A3A;"></div>Check this</div>
      <div style="display: inline-flex; align-items: center; gap: 6px; background: #F2DED8; padding: 5px 10px; border-radius: 999px; font-family: var(--font-body); font-size: 11px; font-weight: 600; color: #7a3426;"><div style="width: 6px; height: 6px; border-radius: 3px; background: #B35B4A;"></div>Needs review</div>
      <div style="display: inline-flex; align-items: center; gap: 6px; background: #DDE6EB; padding: 5px 10px; border-radius: 999px; font-family: var(--font-body); font-size: 11px; font-weight: 600; color: #2e4555;"><div style="width: 6px; height: 6px; border-radius: 3px; background: #5A7A8F;"></div>Reference</div>
      <div style="display: inline-flex; align-items: center; gap: 6px; background: var(--plum-100); padding: 5px 10px; border-radius: 999px; font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--plum-700);">New</div>
    </div>
    <div class="wrap" style="gap: 8px;">
      <div style="background: var(--bone-100); padding: 4px 10px; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">A1c</div>
      <div style="background: var(--bone-100); padding: 4px 10px; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">LDL</div>
      <div style="background: var(--bone-100); padding: 4px 10px; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">HDL</div>
      <div style="background: var(--bone-100); padding: 4px 10px; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">eGFR</div>
    </div>
  </div>
</body></html>
