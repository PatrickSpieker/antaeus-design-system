<!doctype html>
<!-- @dsCard group="Type" name="Type — Scale" subtitle="Tokens, sizes, line-heights" viewport="700x360" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card" style="display: grid; grid-template-columns: 90px 1fr 110px; gap: 10px 18px; align-items: baseline;">
    <!-- header -->
    <div class="label-eyebrow">Token</div>
    <div class="label-eyebrow">Sample</div>
    <div class="label-eyebrow" style="text-align: right;">Size / LH</div>

    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">display-xl</div>
    <div class="display-xl" style="font-size: 44px;">Ground</div>
    <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-align: right;">72 / 78</div>

    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">display-m</div>
    <div class="display-m" style="font-size: 30px;">Your record</div>
    <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-align: right;">38 / 41</div>

    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">h1</div>
    <div class="h1" style="font-size: 22px;">This week's readings</div>
    <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-align: right;">28 / 35</div>

    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">h2</div>
    <div class="h2" style="font-size: 18px;">Medications</div>
    <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-align: right;">22 / 28</div>

    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">body</div>
    <div class="body">Reviewed by Dr. Patel on April 17.</div>
    <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-align: right;">15 / 23</div>

    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">body-s</div>
    <div class="body-s">Secondary body and metadata</div>
    <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-align: right;">13 / 20</div>

    <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">eyebrow</div>
    <div class="eyebrow">Care timeline</div>
    <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-align: right;">11 / 15</div>
  </div>
</body></html>
