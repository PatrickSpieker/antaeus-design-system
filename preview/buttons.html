<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, secondary, ghost, destructive" viewport="700x220" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>.btn-row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }</style>
</head>
<body>
  <div class="card col" style="gap: 14px; background: var(--bone-100); padding: 18px; border-radius: var(--radius-lg); border: 1px solid var(--border-hairline);">
    <div style="font-family: var(--font-heading); font-size: 17px; color: var(--fg-2); letter-spacing: -0.01em;">Buttons</div>

    <div class="btn-row">
      <button class="btn btn-primary">Add measurement</button>
      <button class="btn btn-secondary">Cancel</button>
      <button class="btn btn-tertiary">View record
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button class="btn btn-destructive">Remove reading</button>
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost btn-sm">Small</button>
      <button class="btn btn-primary">Default</button>
      <button class="btn btn-primary btn-lg">Large primary</button>
      <button class="btn btn-primary" disabled>Disabled</button>
    </div>

    <div style="font-family: var(--font-body); font-size: 12px; color: var(--fg-2); line-height: 1.5; padding-top: 6px; border-top: 1px solid var(--border-hairline);">
      <strong style="color: var(--fg-1); font-weight: 600;">Primary</strong> (plum-500) · <strong style="color: var(--fg-1); font-weight: 600;">Secondary</strong> (outlined) · <strong style="color: var(--fg-1); font-weight: 600;">Ghost</strong> (outlined) · <strong style="color: var(--fg-1); font-weight: 600;">Destructive</strong>. Flat surfaces; 48px default controls, 44px compact controls.
    </div>
  </div>
</body></html>
