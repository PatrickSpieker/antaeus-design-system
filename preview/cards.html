<!doctype html>
<!-- @dsCard group="Components" name="Cards" subtitle="Hairline · shadow-sm · radius 16" viewport="700x240" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card col" style="gap: 14px;">
    <div class="label-eyebrow">Card — hairline border, shadow-sm, radius 16</div>
    <div style="background: #fff; border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-sm);">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <div>
          <div style="font-family: var(--font-body); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3);">Blood pressure · 7 day avg</div>
          <div style="margin-top: 6px;">
            <span style="font-family: var(--font-heading); font-size: 48px; font-weight: 500; color: var(--fg-1); letter-spacing: -0.015em; font-variant-numeric: tabular-nums; line-height: 1;">118<span style="color: var(--fg-3);">/</span>76</span>
            <span style="font-family: var(--font-body); font-size: 13px; color: var(--fg-3); margin-left: 8px;">mmHg</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; background: #E4ECE3; padding: 5px 10px; border-radius: 999px;">
          <div style="width: 6px; height: 6px; border-radius: 3px; background: #6B8E6F;"></div>
          <span style="font-family: var(--font-body); font-size: 11px; font-weight: 600; color: #3a5a3f;">Within range</span>
        </div>
      </div>
      <div style="margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border-hairline); font-family: var(--font-body); font-size: 13px; color: var(--fg-2); line-height: 1.5;">
        Five readings this week. <span style="font-family: var(--font-heading); font-style: italic; color: var(--fg-brand-strong);">Trending down</span> from last month's 124/80.
      </div>
    </div>
  </div>
</body></html>
