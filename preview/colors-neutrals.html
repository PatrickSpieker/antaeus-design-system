<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Neutrals" subtitle="Bone canvas + warm ink text" viewport="700x260" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card col" style="gap: 14px;">
    <div>
      <div class="label-eyebrow" style="margin-bottom: 8px;">Bone — warm canvas</div>
      <div class="swatch-row">
        <div style="background: #FBF9F6;"><span class="lbl">50 · page</span><span class="hex">#FBF9F6</span></div>
        <div style="background: #F5F1EB;"><span class="lbl">100</span><span class="hex">#F5F1EB</span></div>
        <div style="background: #EAE4DA;"><span class="lbl">200</span><span class="hex">#EAE4DA</span></div>
        <div style="background: #D6CEC1;"><span class="lbl">300</span><span class="hex">#D6CEC1</span></div>
        <div style="background: #ADA396; color: #fff;"><span class="lbl">400</span><span class="hex">#ADA396</span></div>
      </div>
    </div>
    <div>
      <div class="label-eyebrow" style="margin-bottom: 8px;">Ink — warm charcoal text</div>
      <div class="swatch-row">
        <div style="background: #F4F0E5;"><span class="lbl">100</span><span class="hex">#F4F0E5</span></div>
        <div style="background: #ECE7DB;"><span class="lbl">200</span><span class="hex">#ECE7DB</span></div>
        <div style="background: #D9D3C5;"><span class="lbl">300</span><span class="hex">#D9D3C5</span></div>
        <div style="background: #B5AE9F;"><span class="lbl">400</span><span class="hex">#B5AE9F</span></div>
        <div style="background: #8F887A; color: #fff;"><span class="lbl">500</span><span class="hex">#8F887A</span></div>
        <div style="background: #6B6558; color: #fff;"><span class="lbl">600</span><span class="hex">#6B6558</span></div>
        <div style="background: #454139; color: #fff;"><span class="lbl">700</span><span class="hex">#454139</span></div>
        <div style="background: #2B2824; color: #fff;"><span class="lbl">800</span><span class="hex">#2B2824</span></div>
        <div style="background: #1A1814; color: #fff;"><span class="lbl">900</span><span class="hex">#1A1814</span></div>
      </div>
    </div>
  </div>
</body></html>
