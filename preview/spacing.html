<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing — 4pt baseline" subtitle="Token sizes in use" viewport="700x260" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card col" style="gap: 10px;">
    <div class="label-eyebrow">Spacing — 4pt baseline</div>
    <div style="display: grid; grid-template-columns: 50px 1fr 60px; gap: 6px 14px; align-items: center;">
      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">1</div>
      <div style="height: 4px; width: 4px; background: var(--plum-500); border-radius: 2px;"></div>
      <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3);">4px</div>

      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">2</div>
      <div style="height: 4px; width: 8px; background: var(--plum-500); border-radius: 2px;"></div>
      <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3);">8px</div>

      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">3</div>
      <div style="height: 4px; width: 12px; background: var(--plum-500); border-radius: 2px;"></div>
      <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3);">12px</div>

      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">4</div>
      <div style="height: 4px; width: 16px; background: var(--plum-500); border-radius: 2px;"></div>
      <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3);">16px</div>

      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">6</div>
      <div style="height: 4px; width: 24px; background: var(--plum-500); border-radius: 2px;"></div>
      <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3);">24px</div>

      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">8</div>
      <div style="height: 4px; width: 32px; background: var(--plum-500); border-radius: 2px;"></div>
      <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3);">32px</div>

      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">12</div>
      <div style="height: 4px; width: 48px; background: var(--plum-500); border-radius: 2px;"></div>
      <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3);">48px</div>

      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);">20</div>
      <div style="height: 4px; width: 80px; background: var(--plum-500); border-radius: 2px;"></div>
      <div style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3);">80px</div>
    </div>
  </div>
</body></html>
