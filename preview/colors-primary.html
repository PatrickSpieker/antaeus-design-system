<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Plum (primary)" subtitle="Brand plum scale 50–900" viewport="700x180" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card col" style="gap: 10px;">
    <div class="label-eyebrow">Plum — primary brand</div>
    <div class="swatch-row">
      <div style="background: #F4F0F7;"><span class="lbl">50</span><span class="hex">#F4F0F7</span></div>
      <div style="background: #E6DEEE;"><span class="lbl">100</span><span class="hex">#E6DEEE</span></div>
      <div style="background: #C9B8D8;"><span class="lbl">200</span><span class="hex">#C9B8D8</span></div>
      <div style="background: #A68DBD;"><span class="lbl">300</span><span class="hex">#A68DBD</span></div>
      <div style="background: #7F609D; color: #fff;"><span class="lbl">400</span><span class="hex">#7F609D</span></div>
      <div style="background: #5A3F7A; color: #fff;"><span class="lbl">500</span><span class="hex">#5A3F7A</span></div>
      <div style="background: #432E5C; color: #fff;"><span class="lbl">600</span><span class="hex">#432E5C</span></div>
      <div style="background: #322244; color: #fff;"><span class="lbl">700</span><span class="hex">#322244</span></div>
      <div style="background: #231830; color: #fff;"><span class="lbl">800</span><span class="hex">#231830</span></div>
      <div style="background: #15101C; color: #fff;"><span class="lbl">900</span><span class="hex">#15101C</span></div>
    </div>
    <div style="font-family: var(--font-body); font-size: 12px; color: var(--fg-3); margin-top: 2px;">
      <strong style="color: var(--fg-2); font-weight: 600;">500</strong> is brand. Earn it — never flat-fill large areas.
    </div>
  </div>
</body></html>
