<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Plum (primary)" subtitle="Brand plum scale 50–900" viewport="700x180" -->
<html><head><meta charset="utf-8"><style>
/* Shared card shell for Design System preview cards.
   Cards target ~700×<auto> and are rendered small, so specimens should be
   big enough to read. */
/* =========================================================================
   Antaeus Health — Design Tokens
   Colors & Typography
   ========================================================================= */

/* -- Fonts: loaded from Google Fonts (see fonts/README.md for substitutions) */
@import url('https://fonts.googleapis.com/css2?family=Faustina:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  /* ---------------------------------------------------------------------
     COLOR — Core palette
     Built around a deep, desaturated plum. Warm off-white canvas keeps the
     product feeling calm and clinical without going cold/corporate-blue.
     --------------------------------------------------------------------- */

  /* Plum — primary brand */
  --plum-50:  #F4F0F7;
  --plum-100: #E6DEEE;
  --plum-200: #C9B8D8;
  --plum-300: #A68DBD;
  --plum-400: #7F609D;
  --plum-500: #5A3F7A;   /* brand */
  --plum-600: #432E5C;
  --plum-700: #322244;
  --plum-800: #231830;
  --plum-900: #15101C;

  /* Bone — warm neutral canvas (not white, not beige) */
  --bone-50:  #FBF9F6;   /* page */
  --bone-100: #F5F1EB;
  --bone-200: #EAE4DA;
  --bone-300: #D6CEC1;
  --bone-400: #ADA396;

  /* Ink — text neutrals, slightly warm to sit on bone */
  --ink-900: #1A1814;
  --ink-800: #2B2824;
  --ink-700: #454139;
  --ink-600: #6B6558;
  --ink-500: #8F887A;
  --ink-400: #B5AE9F;
  --ink-300: #D9D3C5;
  --ink-200: #ECE7DB;
  --ink-100: #F4F0E5;

  /* Semantic accents — muted, never neon */
  --sage-500:   #6B8E6F;   /* success, healthy */
  --sage-100:   #E4ECE3;
  --amber-500:  #C48A3A;   /* caution, attention */
  --amber-100:  #F5E8D0;
  --clay-500:   #B35B4A;   /* alert, elevated */
  --clay-100:   #F2DED8;
  --sky-500:    #5A7A8F;   /* info, diagnostic */
  --sky-100:    #DDE6EB;

  /* ---------------------------------------------------------------------
     COLOR — Semantic foreground/background
     --------------------------------------------------------------------- */
  --bg-page:        var(--bone-50);
  --bg-surface:     #FFFFFF;
  --bg-surface-2:   var(--bone-100);
  --bg-sunken:      var(--bone-200);
  --bg-inverse:     var(--plum-900);

  --fg-1:           var(--ink-900);      /* primary text */
  --fg-2:           var(--ink-700);      /* secondary */
  --fg-3:           var(--ink-600);      /* tertiary, captions */
  --fg-4:           var(--ink-500);      /* quaternary, placeholders */
  --fg-inverse:     var(--bone-50);
  --fg-brand:       var(--plum-500);
  --fg-brand-strong:var(--plum-700);

  --border-hairline: rgba(26, 24, 20, 0.08);
  --border-subtle:   rgba(26, 24, 20, 0.12);
  --border-strong:   rgba(26, 24, 20, 0.22);
  --border-brand:    var(--plum-500);

  /* Glass — translucent panels over warm backgrounds */
  --glass-white:   rgba(255, 255, 255, 0.72);
  --glass-bone:    rgba(251, 249, 246, 0.78);
  --glass-plum:    rgba(67, 46, 92, 0.82);
  --glass-blur:    20px;

  /* ---------------------------------------------------------------------
     TYPE — Families
     Display = Faustina (humanist serif, warm + contemporary)
     UI/body = IBM Plex Sans (humanist, institutional, legible)
     Mono    = JetBrains Mono (metrics, data — tabular numerals)
     --------------------------------------------------------------------- */
  --font-serif:  'Faustina', 'Tiempos Text', Georgia, 'Times New Roman', serif;
  --font-sans:   'IBM Plex Sans', 'Söhne', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-mono:   'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;

  /* ---------------------------------------------------------------------
     TYPE — Scale (fluid-ish, desktop baseline)
     Display uses serif; UI uses sans. Tight leading on large sizes.
     --------------------------------------------------------------------- */
  --text-display-xl: 72px;
  --text-display-l:  54px;
  --text-display-m:  38px;
  --text-display-s:  29px;

  --text-h1: 28px;
  --text-h2: 22px;
  --text-h3: 18px;
  --text-h4: 16px;

  --text-body-l:   17px;
  --text-body:     15px;
  --text-body-s:   13px;
  --text-caption:  12px;
  --text-micro:    11px;

  --leading-display: 1.08;
  --leading-heading: 1.25;
  --leading-body:    1.55;
  --leading-tight:   1.35;

  --tracking-display: -0.02em;
  --tracking-heading: -0.005em;
  --tracking-body:    0;
  --tracking-caps:    0.08em;

  /* ---------------------------------------------------------------------
     SPACING — 4pt baseline
     --------------------------------------------------------------------- */
  --space-0:  0;
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;
  --space-24: 96px;

  /* ---------------------------------------------------------------------
     RADII — Restrained; never pill-y unless specifically a tag/chip
     --------------------------------------------------------------------- */
  --radius-xs:  4px;
  --radius-sm:  6px;
  --radius-md:  10px;
  --radius-lg:  16px;
  --radius-xl:  24px;
  --radius-pill: 999px;

  /* ---------------------------------------------------------------------
     SHADOWS — Two systems: UI (soft, close) and elevation (glassy lift)
     Never hard drop shadows. Always warm-tinted, never pure black.
     --------------------------------------------------------------------- */
  --shadow-xs:  0 1px 2px  rgba(26, 24, 20, 0.04),
                0 1px 1px  rgba(26, 24, 20, 0.03);
  --shadow-sm:  0 2px 6px  rgba(26, 24, 20, 0.05),
                0 1px 2px  rgba(26, 24, 20, 0.04);
  --shadow-md:  0 8px 24px rgba(26, 24, 20, 0.08),
                0 2px 6px  rgba(26, 24, 20, 0.05);
  --shadow-lg:  0 24px 60px rgba(26, 24, 20, 0.12),
                0 8px 20px  rgba(26, 24, 20, 0.06);
  --shadow-xl:  0 40px 100px rgba(26, 24, 20, 0.16),
                0 12px 30px  rgba(26, 24, 20, 0.08);

  /* Inner shadow for sunken inputs */
  --shadow-inset: inset 0 1px 2px rgba(26, 24, 20, 0.06);

  /* Focus ring — plum at low alpha */
  --ring-focus: 0 0 0 3px rgba(90, 63, 122, 0.28);

  /* ---------------------------------------------------------------------
     MOTION — Springy but restrained. Mostly ease-out.
     --------------------------------------------------------------------- */
  --ease-out:    cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  --dur-instant: 80ms;
  --dur-fast:    140ms;
  --dur-base:    220ms;
  --dur-slow:    360ms;
  --dur-slower:  520ms;
}

/* =========================================================================
   SEMANTIC ELEMENT STYLES
   Apply these via class (.h1, .body, .mono) OR directly via selectors.
   ========================================================================= */

.display-xl, .display-l, .display-m, .display-s {
  font-family: var(--font-serif);
  font-weight: 500;
  line-height: var(--leading-display);
  letter-spacing: var(--tracking-display);
  color: var(--fg-1);
}
.display-xl { font-size: var(--text-display-xl); }
.display-l  { font-size: var(--text-display-l); }
.display-m  { font-size: var(--text-display-m); }
.display-s  { font-size: var(--text-display-s); }

.h1, .h2, .h3, .h4 {
  font-family: var(--font-sans);
  font-weight: 600;
  line-height: var(--leading-heading);
  letter-spacing: var(--tracking-heading);
  color: var(--fg-1);
}
.h1 { font-size: var(--text-h1); }
.h2 { font-size: var(--text-h2); }
.h3 { font-size: var(--text-h3); font-weight: 600; }
.h4 { font-size: var(--text-h4); font-weight: 600; }

.body-l, .body, .body-s {
  font-family: var(--font-sans);
  font-weight: 400;
  line-height: var(--leading-body);
  color: var(--fg-1);
}
.body-l { font-size: var(--text-body-l); }
.body   { font-size: var(--text-body); }
.body-s { font-size: var(--text-body-s); color: var(--fg-2); }

.caption {
  font-family: var(--font-sans);
  font-size: var(--text-caption);
  font-weight: 500;
  line-height: var(--leading-tight);
  color: var(--fg-3);
}

.eyebrow {
  font-family: var(--font-sans);
  font-size: var(--text-micro);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: var(--tracking-caps);
  color: var(--fg-3);
}

.mono, .metric {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1, 'zero' 1;
}
.metric {
  font-size: var(--text-display-m);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--fg-1);
}

/* Italic serif — editorial emphasis, e.g. a quote or a metric label */
.serif-italic {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  color: var(--fg-brand-strong);
}


html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-page);
  color: var(--fg-1);
  font-family: var(--font-sans);
  font-size: var(--text-body);
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  padding: 24px;
  box-sizing: border-box;
  min-height: 100vh;
}

.card {
  width: 100%;
  box-sizing: border-box;
}

.row { display: flex; align-items: center; gap: 16px; }
.col { display: flex; flex-direction: column; gap: 16px; }
.wrap { display: flex; flex-wrap: wrap; gap: 12px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 16px; }

.swatch {
  width: 80px;
  height: 80px;
  border-radius: var(--radius-md);
  box-shadow: inset 0 0 0 1px var(--border-hairline);
  display: flex;
  align-items: flex-end;
  padding: 8px;
  box-sizing: border-box;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-1);
}
.swatch.dark { color: var(--fg-inverse); }

.swatch-row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: inset 0 0 0 1px var(--border-hairline); }
.swatch-row > div {
  flex: 1;
  height: 72px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 8px;
  box-sizing: border-box;
  font-family: var(--font-mono);
  font-size: 9.5px;
}
.swatch-row .lbl { font-weight: 500; opacity: 0.9; }
.swatch-row .hex { opacity: 0.7; }

.label-eyebrow {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-3);
  font-family: var(--font-sans);
}

</style></head>
<body>
  <div class="card col" style="gap: 10px;">
    <div class="label-eyebrow">Plum — primary brand</div>
    <div class="swatch-row">
      <div style="background: #F4F0F7;"><span class="lbl">50</span><span class="hex">#F4F0F7</span></div>
      <div style="background: #E6DEEE;"><span class="lbl">100</span><span class="hex">#E6DEEE</span></div>
      <div style="background: #C9B8D8;"><span class="lbl">200</span><span class="hex">#C9B8D8</span></div>
      <div style="background: #A68DBD;"><span class="lbl">300</span><span class="hex">#A68DBD</span></div>
      <div style="background: #7F609D; color: #fff;"><span class="lbl">400</span><span class="hex">#7F609D</span></div>
      <div style="background: #5A3F7A; color: #fff;"><span class="lbl">500</span><span class="hex">#5A3F7A</span></div>
      <div style="background: #432E5C; color: #fff;"><span class="lbl">600</span><span class="hex">#432E5C</span></div>
      <div style="background: #322244; color: #fff;"><span class="lbl">700</span><span class="hex">#322244</span></div>
      <div style="background: #231830; color: #fff;"><span class="lbl">800</span><span class="hex">#231830</span></div>
      <div style="background: #15101C; color: #fff;"><span class="lbl">900</span><span class="hex">#15101C</span></div>
    </div>
    <div style="font-family: var(--font-sans); font-size: 12px; color: var(--fg-3); margin-top: 2px;">
      <strong style="color: var(--fg-2); font-weight: 600;">500</strong> is brand. Earn it — never flat-fill large areas.
    </div>
  </div>
</body></html>
