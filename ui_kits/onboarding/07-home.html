<body>
<div class="screen home">
  <header class="topbar">

    <button class="chip-btn" type="button" aria-haspopup="listbox"><span class="chip">Your records<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>
  </header>
  <main class="content">
    <h1 class="display-s">Today</h1>

  </main>
  <nav class="tabbar" aria-label="Main">
