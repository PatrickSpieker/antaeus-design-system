<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antaeus Health onboarding, Code</title>
<!-- Heading and body faces come from colors_and_type.css through the role variables in addon.css. No family is named in this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../addon.css">
</head>
<body>
<div class="screen">
  <nav class="top">
    <button class="back" type="button" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
  </nav>
  <main class="form">
    <p class="eyebrow">Antaeus Health</p>
    <h1 class="display-s">Verify your<br>phone number</h1>
    <p class="lede">Enter the code sent to +12025550123.</p>
    <label class="field">
      <input type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Verification code" aria-label="Verification code">
    </label>
    <button class="btn btn-primary" type="button" disabled>Verify and continue</button>
    <div class="links">
      <span class="muted" aria-live="polite">Resend code in 48s</span>
      <a class="link" href="#">Change number</a>
    </div>
  </main>
</div>
</body>
</html>
