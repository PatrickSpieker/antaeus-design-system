<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antaeus Health onboarding, Invite code</title>
<!-- Heading and body faces come from colors_and_type.css through the role variables in addon.css. No family is named in this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../addon.css">
</head>
<body>
<div class="screen">
  <div class="top" aria-hidden="true"></div>
  <main class="form">
    <p class="eyebrow">Antaeus Health</p>
    <h1 class="display-s">Enter your invite code</h1>
    <p class="lede">Enter the invite code you received to join Antaeus.</p>
    <label class="field">
      <input type="text" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="Invite code" aria-label="Invite code">
    </label>
    <button class="btn btn-primary" type="button" disabled>Continue</button>
  </main>
</div>
</body>
</html>
