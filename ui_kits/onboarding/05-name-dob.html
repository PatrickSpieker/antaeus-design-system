<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antaeus Health onboarding, Name and date of birth</title>
<!-- Heading and body faces come from colors_and_type.css through the role variables in addon.css. No family is named in this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../addon.css">
</head>
<body>
<div class="screen">
  <div class="top" aria-hidden="true"></div>
  <main class="form">
    <p class="eyebrow">Antaeus Health</p>
    <h1 class="display-s">Tell us about yourself</h1>
    <p class="lede">Enter your full name and date of birth. You must be 18 or older to use Antaeus.</p>
    <label class="field">
      <input type="text" autocomplete="name" placeholder="Full name" aria-label="Full name">
    </label>
    <button class="field picker" type="button" aria-haspopup="dialog">
      <span class="field-label">Date of birth</span>
      <span class="field-action">Select date</span>
    </button>
    <p class="terms">By tapping Accept and continue, you accept the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
    <button class="btn btn-primary" type="button" disabled>Accept and continue</button>
  </main>
</div>
</body>
</html>
