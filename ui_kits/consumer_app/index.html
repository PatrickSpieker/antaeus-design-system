/* =========================================================================
   Antaeus Health — Design Tokens
   Colors & Typography
   ========================================================================= */

/* -- Fonts: loaded from Google Fonts (see fonts/README.md for substitutions) */
@import url('https://fonts.googleapis.com/css2?family=Faustina:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  /* ---------------------------------------------------------------------
     COLOR — Core palette
     Built around a deep, desaturated plum. Warm off-white canvas keeps the
     product feeling calm and clinical without going cold/corporate-blue.
     --------------------------------------------------------------------- */

  /* Plum — primary brand */
  --plum-50:  #F4F0F7;
  --plum-100: #E6DEEE;
  --plum-200: #C9B8D8;
  --plum-300: #A68DBD;
  --plum-400: #7F609D;
  --plum-500: #5A3F7A;   /* brand */
  --plum-600: #432E5C;
  --plum-700: #322244;
  --plum-800: #231830;
  --plum-900: #15101C;

  /* Bone — warm neutral canvas (not white, not beige) */
  --bone-50:  #FBF9F6;   /* page */
  --bone-100: #F5F1EB;
  --bone-200: #EAE4DA;
  --bone-300: #D6CEC1;
  --bone-400: #ADA396;

  /* Ink — text neutrals, slightly warm to sit on bone */
  --ink-900: #1A1814;
  --ink-800: #2B2824;
  --ink-700: #454139;
  --ink-600: #6B6558;
  --ink-500: #8F887A;
  --ink-400: #B5AE9F;
  --ink-300: #D9D3C5;
  --ink-200: #ECE7DB;
  --ink-100: #F4F0E5;

  /* Semantic accents — muted, never neon */
  --sage-500:   #6B8E6F;   /* success, healthy */
  --sage-100:   #E4ECE3;
  --amber-500:  #C48A3A;   /* caution, attention */
  --amber-100:  #F5E8D0;
  --clay-500:   #B35B4A;   /* alert, elevated */
  --clay-100:   #F2DED8;
  --sky-500:    #5A7A8F;   /* info, diagnostic */
  --sky-100:    #DDE6EB;

  /* ---------------------------------------------------------------------
     COLOR — Semantic foreground/background
     --------------------------------------------------------------------- */
  --bg-page:        var(--bone-50);
  --bg-surface:     #FFFFFF;
  --bg-surface-2:   var(--bone-100);
  --bg-sunken:      var(--bone-200);
  --bg-inverse:     var(--plum-900);

  --fg-1:           var(--ink-900);      /* primary text */
  --fg-2:           var(--ink-700);      /* secondary */
  --fg-3:           var(--ink-600);      /* tertiary, captions */
  --fg-4:           var(--ink-500);      /* quaternary, placeholders */
  --fg-inverse:     var(--bone-50);
  --fg-brand:       var(--plum-500);
  --fg-brand-strong:var(--plum-700);

  --border-hairline: rgba(26, 24, 20, 0.08);
  --border-subtle:   rgba(26, 24, 20, 0.12);
  --border-strong:   rgba(26, 24, 20, 0.22);
  --border-brand:    var(--plum-500);

  /* Glass — translucent panels over warm backgrounds */
  --glass-white:   rgba(255, 255, 255, 0.72);
  --glass-bone:    rgba(251, 249, 246, 0.78);
  --glass-plum:    rgba(67, 46, 92, 0.82);
  --glass-blur:    20px;

  /* ---------------------------------------------------------------------
     TYPE — Families
     Display = Faustina (humanist serif, warm + contemporary)
     UI/body = IBM Plex Sans (humanist, institutional, legible)
     Mono    = JetBrains Mono (metrics, data — tabular numerals)
     --------------------------------------------------------------------- */
  --font-serif:  'Faustina', 'Tiempos Text', Georgia, 'Times New Roman', serif;
  --font-sans:   'IBM Plex Sans', 'Söhne', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-mono:   'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;

  /* ---------------------------------------------------------------------
     TYPE — Scale (fluid-ish, desktop baseline)
     Display uses serif; UI uses sans. Tight leading on large sizes.
     --------------------------------------------------------------------- */
  --text-display-xl: 72px;
  --text-display-l:  54px;
  --text-display-m:  38px;
  --text-display-s:  29px;

  --text-h1: 28px;
  --text-h2: 22px;
  --text-h3: 18px;
  --text-h4: 16px;

  --text-body-l:   17px;
  --text-body:     15px;
  --text-body-s:   13px;
  --text-caption:  12px;
  --text-micro:    11px;

  --leading-display: 1.08;
  --leading-heading: 1.25;
  --leading-body:    1.55;
  --leading-tight:   1.35;

  --tracking-display: -0.02em;
  --tracking-heading: -0.005em;
  --tracking-body:    0;
  --tracking-caps:    0.08em;

  /* ---------------------------------------------------------------------
     SPACING — 4pt baseline
     --------------------------------------------------------------------- */
  --space-0:  0;
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;
  --space-24: 96px;

  /* ---------------------------------------------------------------------
     RADII — Restrained; never pill-y unless specifically a tag/chip
     --------------------------------------------------------------------- */
  --radius-xs:  4px;
  --radius-sm:  6px;
  --radius-md:  10px;
  --radius-lg:  16px;
  --radius-xl:  24px;
  --radius-pill: 999px;

  /* ---------------------------------------------------------------------
     SHADOWS — Two systems: UI (soft, close) and elevation (glassy lift)
     Never hard drop shadows. Always warm-tinted, never pure black.
     --------------------------------------------------------------------- */
  --shadow-xs:  0 1px 2px  rgba(26, 24, 20, 0.04),
                0 1px 1px  rgba(26, 24, 20, 0.03);
  --shadow-sm:  0 2px 6px  rgba(26, 24, 20, 0.05),
                0 1px 2px  rgba(26, 24, 20, 0.04);
  --shadow-md:  0 8px 24px rgba(26, 24, 20, 0.08),
                0 2px 6px  rgba(26, 24, 20, 0.05);
  --shadow-lg:  0 24px 60px rgba(26, 24, 20, 0.12),
                0 8px 20px  rgba(26, 24, 20, 0.06);
  --shadow-xl:  0 40px 100px rgba(26, 24, 20, 0.16),
                0 12px 30px  rgba(26, 24, 20, 0.08);

  /* Inner shadow for sunken inputs */
  --shadow-inset: inset 0 1px 2px rgba(26, 24, 20, 0.06);

  /* Focus ring — plum at low alpha */
  --ring-focus: 0 0 0 3px rgba(90, 63, 122, 0.28);

  /* ---------------------------------------------------------------------
     MOTION — Springy but restrained. Mostly ease-out.
     --------------------------------------------------------------------- */
  --ease-out:    cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  --dur-instant: 80ms;
  --dur-fast:    140ms;
  --dur-base:    220ms;
  --dur-slow:    360ms;
  --dur-slower:  520ms;
}

/* =========================================================================
   SEMANTIC ELEMENT STYLES
   Apply these via class (.h1, .body, .mono) OR directly via selectors.
   ========================================================================= */

.display-xl, .display-l, .display-m, .display-s {
  font-family: var(--font-serif);
  font-weight: 500;
  line-height: var(--leading-display);
  letter-spacing: var(--tracking-display);
  color: var(--fg-1);
}
.display-xl { font-size: var(--text-display-xl); }
.display-l  { font-size: var(--text-display-l); }
.display-m  { font-size: var(--text-display-m); }
.display-s  { font-size: var(--text-display-s); }

.h1, .h2, .h3, .h4 {
  font-family: var(--font-sans);
  font-weight: 600;
  line-height: var(--leading-heading);
  letter-spacing: var(--tracking-heading);
  color: var(--fg-1);
}
.h1 { font-size: var(--text-h1); }
.h2 { font-size: var(--text-h2); }
.h3 { font-size: var(--text-h3); font-weight: 600; }
.h4 { font-size: var(--text-h4); font-weight: 600; }

.body-l, .body, .body-s {
  font-family: var(--font-sans);
  font-weight: 400;
  line-height: var(--leading-body);
  color: var(--fg-1);
}
.body-l { font-size: var(--text-body-l); }
.body   { font-size: var(--text-body); }
.body-s { font-size: var(--text-body-s); color: var(--fg-2); }

.caption {
  font-family: var(--font-sans);
  font-size: var(--text-caption);
  font-weight: 500;
  line-height: var(--leading-tight);
  color: var(--fg-3);
}

.eyebrow {
  font-family: var(--font-sans);
  font-size: var(--text-micro);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: var(--tracking-caps);
  color: var(--fg-3);
}

.mono, .metric {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1, 'zero' 1;
}
.metric {
  font-size: var(--text-display-m);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--fg-1);
}

/* Italic serif — editorial emphasis, e.g. a quote or a metric label */
.serif-italic {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  color: var(--fg-brand-strong);
}


/* Consumer App — warm bone canvas for iOS frame */


html, body { margin: 0; background: var(--bone-100); font-family: var(--font-sans); color: var(--fg-1); -webkit-font-smoothing: antialiased; }

.app-screen {
  width: 100%;
  height: 100%;
  background: var(--bone-50);
  display: flex;
  flex-direction: column;
  font-family: var(--font-sans);
  color: var(--fg-1);
  overflow: hidden;
}

.app-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 8px 20px 120px;
}

.eyebrow-sm {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-3);
}

.metric-big {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--fg-1);
}

.serif-moment {
  font-family: var(--font-serif);
  font-weight: 500;
  color: var(--fg-1);
  letter-spacing: -0.01em;
  line-height: 1.08;
}

.card-soft {
  background: #fff;
  border: 1px solid var(--border-hairline);
  border-radius: 16px;
  box-shadow: var(--shadow-sm);
  padding: 18px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
}
.chip .dot { width: 6px; height: 6px; border-radius: 3px; }
.chip.sage { background: #E4ECE3; color: #3a5a3f; }
.chip.sage .dot { background: #6B8E6F; }
.chip.amber { background: #F5E8D0; color: #7a541e; }
.chip.amber .dot { background: #C48A3A; }
.chip.clay { background: #F2DED8; color: #7a3426; }
.chip.clay .dot { background: #B35B4A; }
.chip.plum { background: var(--plum-100); color: var(--plum-700); }

button { font-family: inherit; }

</style>

  <style>
    body { background: linear-gradient(160deg, #F5F1EB 0%, #EADFF0 100%); min-height: 100vh; margin: 0; display: flex; align-items: flex-start; justify-content: center; padding: 48px 20px; }
    .device-wrap { display: flex; align-items: flex-start; gap: 48px; }

<body>
  <div id="root"></div>
  <script type="text/babel">

// ===== ios-frame.jsx =====

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}

// Keyboard — iOS 26 liquid glass

function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

    function App() {
      const [tab, setTab] = React.useState('home');
      const [sheet, setSheet] = React.useState(false);

      // Persist tab across reload
      React.useEffect(() => {
        const saved = localStorage.getItem('antaeus.tab');
        if (saved) setTab(saved);
      }, []);
      React.useEffect(() => { localStorage.setItem('antaeus.tab', tab); }, [tab]);

      const Screen = {
        home: <TodayScreen/>,
        data: <RecordScreen onAdd={() => setSheet(true)}/>,
        care: <CareScreen/>,
        me:   <YouScreen/>,
      }[tab];

      return (
        <div>
          <IOSDevice width={402} height={874}>
            <div className="app-screen" data-screen-label={`01 ${tab}`}>
              {/* Make top padding for status bar / dynamic island */}
              <div style={{ flex: 1, overflow: 'hidden', paddingTop: 54, position: 'relative' }}>
                <div style={{ position: 'absolute', inset: 0, paddingTop: 54, overflowY: 'auto' }}>
                  {Screen}
                </div>
              </div>
              <TabBar active={tab} onChange={setTab}/>
              {sheet && <AddMeasurementSheet onClose={() => setSheet(false)} onSave={() => setSheet(false)}/>}
            </div>
          </IOSDevice>
          <div className="caption">Antaeus Health · Consumer App · Today / Record / Care / You</div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
